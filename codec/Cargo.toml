[package]
name = "kafgres-codec"
version = "0.1.0"
edition = "2021"
license = "Elastic-2.0"
description = "Kafka wire protocol codec, generated from vendored schemas. No pgrx, no Postgres."

[dependencies]
bytes = "1"
crc32c = "0.6"

# Decompression, for log compaction: the cleaner has to read record keys, and a compacted
# topic has to reject a null key at produce time, so the broker must see inside a
# compressed batch. Nothing else in kafgres decompresses, and every codec round-trips
# without a line of code here.
#
# **Pure Rust, deliberately, all four.** This parses attacker-supplied bytes inside a
# Postgres backend, where a segfault in a C library is not an error response but a crashed
# database taking every other connection with it. The C-backed alternatives (`zstd`'s
# bindings, `libz-sys`) are faster and are the wrong trade here; if a benchmark on real
# hardware later says the difference matters, that is the moment to revisit it with numbers
# rather than now on the assumption that it might.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
snap = "1"
lz4_flex = { version = "0.11", default-features = false, features = ["frame"] }
ruzstd = "0.7"

[features]
sample = []
