[package]
name = "ffi-footprint-scanner"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone: not a member of any enclosing workspace.
[workspace]

[dependencies]
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
serde_json = "1"
quote = "1"

[profile.release]
opt-level = 2
