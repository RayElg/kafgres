services:
  postgres:
    build:
      context: .
      dockerfile: docker/Dockerfile
    # Named explicitly so the standby below (and the failover tests) reuse the
    # same image regardless of the directory the checkout lives in.
    image: kafgres-postgres
    ports:
      # Defaults to localhost if DOCKER_BIND_IP isn't set.
      - "${DOCKER_BIND_IP:-127.0.0.1}:5432:5432"
      - "${DOCKER_BIND_IP:-127.0.0.1}:9092:9092"
    environment:
      POSTGRES_PASSWORD: postgres
      KAFGRES_TRACE_API: "${KAFGRES_TRACE_API:-}"
    volumes:
      # Test certificates for the TLS suite, generated by tests/tls/generate.sh and not
      # checked in. Read-only, and absent on a fresh clone, so the TLS tests skip
      # themselves rather than fail when it has not been run.
      - ./tests/tls:/tls:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The failover rig. Behind a profile, so the ordinary suite does not pay for it:
  #   docker compose --profile failover up -d
  #
  # A real physical standby, not a simulation. The divergence the failover tests are
  # about, a consumer whose position is past the new leader's log end, only exists on an
  # async
  # replica, and only becomes observable if WAL replay can be paused.
  standby:
    # The primary's image, not a second build of the same Dockerfile. A profile-gated
    # service is skipped by a plain `docker compose build`, so its own build stays at
    # whatever it was first created from, and the failover tests then verify a stale
    # broker while every other suite tests the new one. Found exactly that way.
    image: kafgres-postgres
    profiles: ["failover"]
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/standby-entrypoint.sh"]
    environment:
      PRIMARY_HOST: postgres
      POSTGRES_PASSWORD: postgres
      # Matched to whatever the primary is running; the failover suite sets both.
      KAFGRES_ENGINE: "${KAFGRES_ENGINE:-table}"
    ports:
      - "${DOCKER_BIND_IP:-127.0.0.1}:5433:5432"
      # The broker on the standby listens only once promoted.
      - "${DOCKER_BIND_IP:-127.0.0.1}:9192:9192"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Reference broker for the conformance gate. Behind a profile:
  #   docker compose --profile conformance up -d
  #
  # The gate is "the same scenario produces the same observable result here and on a
  # real Kafka, and every difference is written down". Without this service the suite
  # only proves the broker is self-consistent.
  kafka:
    # Matched to `codec/KAFKA_VERSION`, not to whatever is newest. A reference broker of a
    # different vintage turns version skew into a false deviation: 4.1.0 serves
    # OffsetCommit and OffsetFetch only to v9, so against it our (correct, 4.3.1) v10
    # advertisement looks like over-advertising.
    image: apache/kafka:4.3.1
    profiles: ["conformance"]
    # Pinned, because the image resolves its own hostname at startup and a generated
    # container id sometimes does not resolve: Kafka then dies with UnknownHostException
    # before it logs anything useful.
    hostname: kafka
    ports:
      - "${DOCKER_BIND_IP:-127.0.0.1}:9292:9292"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9292,CONTROLLER://:9293
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9292
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9293
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Auto-creation off, to match kafgres: a scenario that silently creates its topic
      # on one broker and errors on the other is not a comparison of anything.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # The default is -Xmx1G -Xms1G, and on a development box running Postgres, the
      # integration suite and a pgrx test container at the same time that is enough to get
      # the reference broker OOM-killed: exit 137, no log line, and a wire-diff run that
      # silently compares against nothing. A reference broker holding a handful of topics
      # for one scenario does not need a gigabyte.
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9292 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
